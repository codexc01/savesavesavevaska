[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "savemod-bot"
version = "0.1.0"
description = "Telegram Business Bot — SaveMOD: deleted/edited message archive"
requires-python = ">=3.12"
dependencies = [
    # Telegram
    "aiogram==3.22.0",
    "aiohttp>=3.10,<4.0",

    # Database
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",

    # Redis / queues
    "redis[hiredis]==5.2.0",

    # Config / env
    "pydantic>=2.9,<3.0",
    "pydantic-settings==2.7.0",
    "python-dotenv==1.0.1",

    # Logging
    "structlog==24.4.0",

    # Utilities
    "tenacity==9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-mock==3.14.0",
    "httpx==0.28.1",
    "ruff==0.8.4",
    "mypy==1.13.0",
    "types-redis==4.6.0.20241004",
    "aiosqlite>=0.20.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (partial)
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "ANN401", # dynamically typed expressions (Any)
    "B008",   # do not perform function calls in default arguments
    "UP017",  # datetime.UTC — not available in Python 3.9
    "UP007",  # Union/Optional syntax for Python 3.9 runtime SQLAlchemy compat
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "S101"]
"migrations/*" = ["ANN"]
"app/handlers/*" = ["TCH"]   # aiogram needs runtime type access
"app/admin/*" = ["TCH"]
"app/diagnostics/*" = ["TCH"]
"app/database/*" = ["TCH"]
"app/services/*" = ["TCH"]
"app/domain/*" = ["TCH"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
filterwarnings = [
    "ignore::DeprecationWarning",
]
